name: Feature request
description: Suggest something Vertion should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        Describe the situation rather than the feature. Knowing the underlying
        problem often turns up a simpler answer than the one you had in mind —
        and sometimes one that already exists.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Vertion to do?
      description: If you have a syntax or flag in mind, sketch it here.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: |
        Existing options that got close, and where they fell short. Worth
        skimming [DOCS.md](https://github.com/vertX-dev/vertion/blob/main/DOCS.md)
        first — tags, conditions, variant directories, and profiles between them
        cover a lot of ground.

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Marker syntax
        - CLI command or flag
        - Config file
        - Build output
        - VSCode extension
        - Other
    validations:
      required: true
