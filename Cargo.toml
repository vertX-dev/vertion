[package]
name = "vertion"
version = "1.0.0"
edition = "2021"
authors = ["vertX"]
description = "Filter source files by version markers and emit a per-version build tree."
license = "MIT"
readme = "README.md"
repository = "https://github.com/vertX-dev/vertion"
homepage = "https://github.com/vertX-dev/vertion"
keywords = ["versioning", "build", "preprocessor", "cli", "source-filter"]
categories = ["command-line-utilities", "development-tools::build-utils"]
rust-version = "1.85"
# The VSCode extension ships through the marketplace, not crates.io. Without
# this the whole `editor/` tree (including a 150 KB package-lock.json) lands
# inside the published crate.
exclude = ["editor/", ".github/", "dist/", "package-lock.json"]

[[bin]]
name = "vertion"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
semver = { version = "1.0", features = ["serde"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `notify` itself is not a direct dependency: the only item this crate needs
# (`RecursiveMode`) comes through the debouncer's re-export, and naming both
# invites two incompatible notify majors in one tree.
notify-debouncer-mini = "0.7"
rayon = "1.10"
indicatif = "0.17"
clap_complete = "4.6.9"
clap_mangen = "0.3.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# `cargo binstall vertion` fetches a prebuilt archive from the GitHub release
# instead of compiling. The paths below must match the asset names produced by
# .github/workflows/release.yml — change one, change the other.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
